
name: Import Fidoria Login UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-login-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Download UI Assets
        run: |
          set -e
          curl -fL \
            "https://raw.githubusercontent.com/ZeeyAl/fidoria-assets/main/fidoria_ui_pack.zip" \
            -o fidoria_ui_pack.zip
          unzip -q fidoria_ui_pack.zip -d temp-ui
          test -d temp-ui/fidoria_ui

      - name: Copy Assets
        run: |
          mkdir -p "UI & UHD/Login UI"
          cp -a temp-ui/fidoria_ui/. "UI & UHD/Login UI/"

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "UI & UHD/Login UI"
          if ! git diff --cached --quiet; then
            git commit -m "Import Fidoria Login UI assets"
            git push
          else
            echo "No changes detected."
          fi

      - name: Cleanup
        if: always()
        run: rm -rf temp-ui fidoria_ui_pack.zip
