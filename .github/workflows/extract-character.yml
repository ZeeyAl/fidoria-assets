
name: Extract Character Assets

on:
  push:
    branches:
      - main
    paths:
      - "Character.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-character:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract Character.zip
        run: |
          if [ ! -f "Character.zip" ]; then
            echo "Character.zip tidak ditemukan."
            exit 1
          fi

          unzip -o Character.zip -d .
          rm Character.zip

      - name: Commit Extracted Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A Character Character.zip

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Extract Character assets"
            git push origin main
          fi
