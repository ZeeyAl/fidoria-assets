
name: Import Job Assets Safely

on:
  push:
    branches: [main]
    paths:
      - 'Job.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import job frames safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import stat

          archive = Path("Job.zip")

          if not archive.is_file():
              raise SystemExit("Job.zip tidak ditemukan!")

          job_map = {
              "swordman_frames": "Swordman",
              "archer2_frames": "Archer",
              "assassin_frames": "Assassin",
              "mage_frames": "Mage",
          }

          added = 0
          skipped = 0
          rejected = 0

          with ZipFile(archive) as z:
              for info in z.infolist():

                  if info.is_dir():
                      continue

                  member = PurePosixPath(info.filename)

                  # Security: reject unsafe paths
                  if member.is_absolute() or ".." in member.parts:
                      rejected += 1
                      continue

                  if stat.S_ISLNK(info.external_attr >> 16):
                      rejected += 1
                      continue

                  if member.suffix.lower() != ".png":
                      skipped += 1
                      continue

                  parts = list(member.parts)

                  # Remove outer Job folder
                  if parts and parts[0] == "Job":
                      parts = parts[1:]

                  if not parts:
                      skipped += 1
                      continue

                  root = parts[0]

                  # NOVICE
                  if root == "Novice_frames":
                      rest = parts[1:]

                      if len(rest) < 4:
                          skipped += 1
                          continue

                      gender = rest[0].lower()

                      if gender not in ("male", "female"):
                          skipped += 1
                          continue

                      dest_parts = [
                          "Player",
                          "Novice",
                          gender.capitalize(),
                          *rest[1:]
                      ]

                  # OTHER JOBS
                  elif root in job_map:
                      rest = parts[1:]

                      # Remove duplicate internal folder
                      if rest and rest[0] == root:
                          rest = rest[1:]

                      job = job_map[root]

                      # ARCHER
                      if job == "Archer":
                          if (
                              len(rest) < 3
                              or rest[0].lower() != "archer"
                              or not rest[1].startswith("row_")
                          ):
                              skipped += 1
                              continue

                          dest_parts = [
                              "Player",
                              "Archer",
                              "Shared",
                              rest[1],
                              *rest[2:]
                          ]

                      # SWORDMAN / MAGE / ASSASSIN
                      else:
                          if len(rest) < 3:
                              skipped += 1
                              continue

                          gender = rest[0].lower()

                          if gender not in ("male", "female"):
                              skipped += 1
                              continue

                          dest_parts = [
                              "Player",
                              job,
                              gender.capitalize(),
                              *rest[1:]
                          ]

                  else:
                      skipped += 1
                      continue

                  destination = Path(*dest_parts)

                  destination.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  try:
                      with z.open(info) as src:
                          signature = src.read(8)

                          if signature != b"\x89PNG\r\n\x1a\n":
                              rejected += 1
                              continue

                          with destination.open("xb") as dst:
                              dst.write(signature)

                              while True:
                                  chunk = src.read(1024 * 1024)

                                  if not chunk:
                                      break

                                  dst.write(chunk)

                      added += 1
                      print("ADD:", destination)

                  except FileExistsError:
                      skipped += 1
                      print("KEEP:", destination)

          print("")
          print("IMPORT SELESAI")
          print("File baru:", added)
          print("Dilewati:", skipped)
          print("Ditolak:", rejected)
          PY

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- Player/

          if git diff --cached --quiet; then
            echo "Tidak ada file baru."
          else
            git commit -m "Import job character assets"
            git push
          fi
