
name: Integrate Fidoria UI Kit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Fidoria_UI_Kit.zip"
      - "Fidoria_UI/**"
      - ".github/workflows/integrate-fidoria-ui.yml"

permissions:
  contents: write

jobs:
  integrate-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Extract UI Kit
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public/assets/fidoria-ui

          if [ -f "Fidoria_UI_Kit.zip" ]; then
            unzip -oq "Fidoria_UI_Kit.zip" -d /tmp/fidoria-kit
            SOURCE="/tmp/fidoria-kit/Fidoria_UI"
          elif [ -d "Fidoria_UI" ]; then
            SOURCE="Fidoria_UI"
          else
            echo "UI Kit tidak ditemukan."
            exit 1
          fi

          test -f "$SOURCE/BACA_SAYA.txt"
          test -d "$SOURCE/1_layar_animasi"
          test -d "$SOURCE/2_layar_diam"
          test -d "$SOURCE/3_aset_ui"
          test -d "$SOURCE/4_avatar"

          cp -a "$SOURCE/." public/assets/fidoria-ui/

      - name: Commit integrated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/assets/fidoria-ui

          if ! git diff --cached --quiet; then
            git commit -m "Integrate Fidoria UI Kit assets"
            git push
          else
            echo "Tidak ada perubahan aset."
          fi
