name: Organize Tiles Assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Organize tile assets
        run: |
          mkdir -p tiles/terrain
          mkdir -p tiles/transitions
          mkdir -p tiles/buildings
          mkdir -p tiles/objects
          mkdir -p tiles/village

      - name: Commit folder structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tiles/
          git diff --cached --quiet || git commit -m "Organize tiles asset structure"
          git push
