
name: Import Skills ZIP safely

on:
  push:
    branches: [main]
    paths:
      - 'Skills.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import only missing files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          archive = Path("Skills.zip")
          if not archive.is_file():
              raise SystemExit("Skills.zip tidak ditemukan")

          added = 0
          skipped = 0

          with ZipFile(archive) as z:
              for info in z.infolist():
                  if info.is_dir():
                      continue

                  member = PurePosixPath(info.filename)
                  if member.is_absolute() or ".." in member.parts:
                      skipped += 1
                      continue

                  parts = list(member.parts)
                  if not parts or parts[0] != "Skills":
                      skipped += 1
                      continue

                  parts = ["Swordman" if p == "Warrior" else p for p in parts]
                  dest = Path(*parts)
                  dest.parent.mkdir(parents=True, exist_ok=True)

                  try:
                      with z.open(info) as src, dest.open("xb") as dst:
                          while True:
                              chunk = src.read(1024 * 1024)
                              if not chunk:
                                  break
                              dst.write(chunk)
                      added += 1
                      print("ADD", dest)
                  except FileExistsError:
                      skipped += 1
                      print("KEEP", dest)

          print(f"Selesai: {added} file baru, {skipped} dilewati.")
          PY

      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Skills
          if git diff --cached --quiet; then
            echo "Tidak ada file baru."
          else
            git commit -m "Import missing skill assets"
            git push
          fi
