name: Deploy Gold Shop UI UHD Assets

on:
  workflow_dispatch:
  push:
    paths:
      - "Gold_Shop_UI_UHD_v2.zip"

permissions:
  contents: write

jobs:
  deploy-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ZIP exists
        run: test -f "Gold_Shop_UI_UHD_v2.zip" || (echo 'ZIP not found in repository root' && exit 1)
      - name: Extract assets
        run: |
          DEST="Gold Shop/Gold shop/UI & UHD"
          mkdir -p "$DEST"
          unzip -oq "Gold_Shop_UI_UHD_v2.zip" -d "$DEST"
      - name: Commit extracted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Gold Shop/Gold shop/UI & UHD"
          if ! git diff --cached --quiet; then
            git commit -m "Deploy Gold Shop UI UHD assets"
            git push
          fi
