
name: Fidoria Asset Auto Extractor

on:
  push:
    branches:
      - main
    paths:
      - 'Enemy mobs.zip'
      - 'Interior_Assets.zip'
      - '.github/workflows/extract-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Enemy and Interior Assets
        run: |
          python3 <<'PY'
          import os
          import zipfile

          mappings = {
              "Enemy mobs.zip": "Enemies",
              "Interior_Assets.zip": "Interiors",
          }

          for archive, destination in mappings.items():
              if not os.path.exists(archive):
                  print(f"Skipped: {archive}")
                  continue

              print(f"Extracting {archive} -> {destination}")

              with zipfile.ZipFile(archive) as z:
                  for item in z.infolist():
                      name = item.filename.replace("\\", "/")

                      if name.startswith("/") or ".." in name.split("/"):
                          continue

                      if "__MACOSX" in name or ".DS_Store" in name:
                          continue

                      if item.is_dir():
                          continue

                      target = os.path.join(
                          destination,
                          name.lstrip("/")
                      )

                      os.makedirs(
                          os.path.dirname(target),
                          exist_ok=True
                      )

                      with z.open(item) as source:
                          with open(target, "wb") as output:
                              output.write(source.read())

          print("Extraction completed.")
          PY

      - name: Commit extracted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Enemies Interiors

          if git diff --cached --quiet; then
            echo "No asset changes."
          else
            git commit -m "Auto extract enemy and interior assets"
            git push
          fi
