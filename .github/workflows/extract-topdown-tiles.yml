name: Rebuild Fidoria Tiles

"on":
workflow_dispatch:
push:
branches:
- main
paths:
- "fidoria_tiles_topdown.zip"

permissions:
contents: write

jobs:
rebuild-tiles:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      ref: main

  - name: Verify ZIP
    run: |
      set -e
      if [ ! -f fidoria_tiles_topdown.zip ]; then
        echo "ZIP file not found in repository root."
        exit 1
      fi
      unzip -t fidoria_tiles_topdown.zip

  - name: Extract ZIP
    run: |
      set -e
      mkdir -p /tmp/fidoria_package
      unzip -oq fidoria_tiles_topdown.zip -d /tmp/fidoria_package

  - name: Locate package
    run: |
      set -e

      TILE_DIR=$(find /tmp/fidoria_package \
        -type d -name tiles -print -quit)

      if [ -z "$TILE_DIR" ]; then
        echo "tiles directory not found inside ZIP."
        exit 1
      fi

      PACKAGE_ROOT=$(dirname "$TILE_DIR")

      echo "TILE_DIR=$TILE_DIR" >> "$GITHUB_ENV"
      echo "PACKAGE_ROOT=$PACKAGE_ROOT" >> "$GITHUB_ENV"

      echo "Package root: $PACKAGE_ROOT"
      echo "Tiles root: $TILE_DIR"

      find "$TILE_DIR" -type f -name "*.png"

  - name: Validate terrain assets
    run: |
      set -e

      test -d "$TILE_DIR"

      BASE_COUNT=$(find "$TILE_DIR" \
        -type d -name base | wc -l)

      TRANSITION_COUNT=$(find "$TILE_DIR" \
        -type d -name transitions | wc -l)

      PNG_COUNT=$(find "$TILE_DIR" \
        -type f -name "*.png" | wc -l)

      echo "Base folders: $BASE_COUNT"
      echo "Transition folders: $TRANSITION_COUNT"
      echo "PNG assets: $PNG_COUNT"

      if [ "$BASE_COUNT" -eq 0 ]; then
        echo "No base folders found."
        exit 1
      fi

      if [ "$TRANSITION_COUNT" -eq 0 ]; then
        echo "No transitions folders found."
        exit 1
      fi

      if [ "$PNG_COUNT" -eq 0 ]; then
        echo "No PNG assets found."
        exit 1
      fi

  - name: Locate rules
    run: |
      set -e

      RULES=$(find "$PACKAGE_ROOT" \
        -type f -name autotile_rules.json -print -quit)

      if [ -z "$RULES" ]; then
        RULES=$(find /tmp/fidoria_package \
          -type f -name autotile_rules.json -print -quit)
      fi

      if [ -z "$RULES" ]; then
        echo "autotile_rules.json not found."
        exit 1
      fi

      echo "RULES=$RULES" >> "$GITHUB_ENV"

  - name: Replace terrain assets
    run: |
      set -e

      rm -rf tiles
      cp -a "$TILE_DIR" tiles

      cp "$RULES" autotile_rules.json

      README=$(find "$PACKAGE_ROOT" \
        -maxdepth 2 -type f -name README.md -print -quit)

      if [ -n "$README" ]; then
        cp "$README" README.md
      fi

      PREVIEWS=$(find "$PACKAGE_ROOT" \
        -maxdepth 2 -type d -name previews -print -quit)

      if [ -n "$PREVIEWS" ]; then
        rm -rf previews
        cp -a "$PREVIEWS" previews
      fi

      TOOLS=$(find "$PACKAGE_ROOT" \
        -maxdepth 2 -type d -name tools -print -quit)

      if [ -n "$TOOLS" ]; then
        rm -rf tools
        cp -a "$TOOLS" tools
      fi

  - name: Verify copied assets
    run: |
      set -e

      COPIED=$(find tiles -type f -name "*.png" | wc -l)
      echo "Copied PNG files: $COPIED"

      if [ "$COPIED" -eq 0 ]; then
        echo "Copy verification failed."
        exit 1
      fi

      find tiles -type f -name "*.png"

  - name: Commit changes
    run: |
      set -e

      git config user.name "github-actions[bot]"
      git config user.email \
        "41898282+github-actions[bot]@users.noreply.github.com"

      git add -A

      if git diff --cached --quiet; then
        echo "No changes to commit."
        exit 0
      fi

      git commit -m "Rebuild terrain tiles and transitions"
      git push origin main
