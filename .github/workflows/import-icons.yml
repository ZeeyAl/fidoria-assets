
name: Import Item Icons ZIP Safely

on:
  push:
    branches: [main]
    paths:
      - 'icon.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Import Icons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          archive = Path("icon.zip")

          if not archive.is_file():
              raise SystemExit("icon.zip tidak ditemukan!")

          categories = {
              "Food": [
                  "boba", "cake", "candy", "canned", "cheese",
                  "coffee", "cookie", "cup", "eggs", "fish",
                  "fruit", "icecream", "jam", "onigiri",
                  "pastry", "popsicle", "soda", "soymilk",
                  "vegetable"
              ],
              "Potion": [
                  "potion"
              ],
              "Materials": [
                  "bone", "cotton", "crystal", "flower",
                  "gem", "ingot", "leaf", "pearl",
                  "plank", "shard", "stoneblock", "wood"
              ],
              "Equipment": [
                  "armor", "boots", "gloves", "hat",
                  "helmet", "shield"
              ],
              "Weapon": [
                  "arrow", "bow", "staff", "sword"
              ],
              "Accessories": [
                  "necklace", "ring"
              ],
              "Misc": [
                  "book", "candle", "coin", "gift",
                  "giftopen", "key", "scroll", "skull",
                  "spellbook"
              ]
          }

          added = 0
          skipped = 0

          with ZipFile(archive) as z:
              for info in z.infolist():

                  if info.is_dir():
                      continue

                  member = PurePosixPath(info.filename)

                  if member.is_absolute() or ".." in member.parts:
                      skipped += 1
                      continue

                  if len(member.parts) != 2:
                      skipped += 1
                      continue

                  if member.parts[0].lower() != "icon":
                      skipped += 1
                      continue

                  filename = member.name

                  if Path(filename).suffix.lower() != ".png":
                      skipped += 1
                      continue

                  lower_name = filename.lower()

                  category = "Misc"

                  for folder, prefixes in categories.items():
                      if any(
                          lower_name.startswith(prefix + "_")
                          or lower_name == prefix + ".png"
                          or lower_name.startswith(prefix + ".")
                          for prefix in prefixes
                      ):
                          category = folder
                          break

                  if lower_name.startswith("bone"):
                      category = "Materials"

                  destination = (
                      Path("Item") / category / filename
                  )

                  destination.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  # Tidak akan menimpa file yang sudah ada.
                  try:
                      with z.open(info) as source:
                          with destination.open("xb") as target:
                              while True:
                                  chunk = source.read(1024 * 1024)
                                  if not chunk:
                                      break
                                  target.write(chunk)

                      added += 1
                      print("ADDED:", destination)

                  except FileExistsError:
                      skipped += 1
                      print("SKIPPED:", destination)

          print("Import selesai!")
          print("File baru:", added)
          print("File dilewati:", skipped)
          PY

      - name: Commit New Icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- Item/

          if git diff --cached --quiet; then
            echo "Tidak ada icon baru."
          else
            git commit -m "Import RPG item icons"
            git push
          fi
